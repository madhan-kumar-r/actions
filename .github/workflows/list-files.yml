name: Update Lambda Environments

on:
  push:
    branches:
      - Dev
    paths:
      - 'Dev-Lambda/*.json'

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: Dev-Lambda/*.json
          json: true

      # ✅ ADD THIS DEBUG STEP
      - name: Print changed files
        run: |
          echo "All changed files (space-separated):"
          echo "${{ steps.changed.outputs.all_changed_files }}"
          echo
          echo "All changed files (JSON):"
          echo '${{ steps.changed.outputs.all_changed_files_json }}'
