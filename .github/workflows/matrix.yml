name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      lambda_name:
        description: "Select Lambda to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - lambda-a
          - lambda-b
          - lambda-c
          - lambda-d
          - lambda-e

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lambda:
          - lambda-a
          - lambda-b
          - lambda-c
          - lambda-d
          - lambda-e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Skip non-selected lambdas
      - name: Skip if not selected
        if: ${{ github.event.inputs.lambda_name != 'all' && github.event.inputs.lambda_name != matrix.lambda }}
        run: |
          echo "Skipping ${{ matrix.lambda }}"
          exit 0
