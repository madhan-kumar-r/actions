name: Deploy Lambda

on:
  workflow_dispatch:
    inputs:
      lambda_name:
        description: "Lambda to deploy (or 'all')"
        required: true
        default: "all"

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lambda:
          - lambda-a
          - lambda-b
          - lambda-c
          - lambda-d
          - lambda-e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if not selected
        if: ${{ github.event.inputs.lambda_name != 'all' && github.event.inputs.lambda_name != matrix.lambda }}
        run: echo "Skipping ${{ matrix.lambda }}" && exit 0
